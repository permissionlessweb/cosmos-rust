[workspace]
resolver = "2"
members = ["cosmos-sdk-proto", "cosmrs"]
exclude = ["proto-build"]

[workspace.dependencies]
# Git rev, not crates.io 0.40.4: that release is still k256 0.13 / crypto-bigint 0.5.5.
tendermint = { git = "https://github.com/permissionlessweb/tendermint-rs", rev = "1c2f1bb1473c370fd1817d2d6c828b24b5e45317", package = "tendermint" }
tendermint-proto = { git = "https://github.com/permissionlessweb/tendermint-rs", rev = "1c2f1bb1473c370fd1817d2d6c828b24b5e45317", package = "tendermint-proto" }
tendermint-rpc = { git = "https://github.com/permissionlessweb/tendermint-rs", rev = "1c2f1bb1473c370fd1817d2d6c828b24b5e45317", package = "tendermint-rpc" }

[patch.crates-io]
informalsystems-pbjson = { path = "../pbjson/pbjson" }
