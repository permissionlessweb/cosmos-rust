[workspace]
resolver = "2"
members = ["cosmos-sdk-proto", "cosmrs"]
exclude = ["proto-build"]

[workspace.dependencies]
# Default is the published revision. The patch below keeps a sibling checkout.
tendermint = { package = "tendermint", version = "0.40.4" }
tendermint-proto = { package = "tendermint-proto", version = "0.40.4" }
tendermint-rpc = { package = "tendermint-rpc", version = "0.40.4" }
[patch.crates-io]

informalsystems-pbjson = { path = "../pbjson/pbjson" }
tendermint = { path = "../tendermint-rs/tendermint" }
tendermint-proto = { path = "../tendermint-rs/proto" }
tendermint-rpc = { path = "../tendermint-rs/rpc" }
